name: Build Lucky APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download offline voice model (for "Hey Lucky")
        run: |
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          uuidgen > app/src/main/assets/model-en-us/uuid

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk Lucky.apk

      - name: Publish download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Lucky v1.${{ github.run_number }}
          make_latest: true
          files: Lucky.apk
          body: |
            Download **Lucky.apk** below and open it on your Android phone.

      - name: Save build log (on failure)
        if: failure()
        shell: bash
        run: |
          mkdir /tmp/logrepo && cp build.log /tmp/logrepo/ 2>/dev/null || echo "no log" > /tmp/logrepo/build.log
          cd /tmp/logrepo && git init -q && git add . \
            && git -c user.name=lucky-bot -c user.email=bot@users.noreply.github.com commit -qm "build log" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:build-log
